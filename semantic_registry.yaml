# v2 materiality rule for P&L lines (Revenue, COGS, SG&A).
# A line is material when BOTH tests pass:
#   1. |% change vs prior| >= pct_change
#   2. |$ change| >= prior_revenue_share * prior-period TOTAL revenue
# TODO: balance sheet lines will use prior_revenue_share applied to prior total assets (not built yet).
materiality:
  pct_change: 0.10
  prior_revenue_share: 0.01

accounts:

  Revenue:
    significant: true
    favorable_when: increase
    flag_proximity: 0.5
    category: income
    interpretation_hint: "Top-line growth driver"

  COGS:
    significant: true
    favorable_when: decrease
    flag_proximity: 0.5
    category: expense
    interpretation_hint: "Direct cost impacting margin"

  SG&A:
    significant: false
    favorable_when: lower_share_of_revenue
    flag_proximity: 0.8
    category: opex
    interpretation_hint: "Judged as a share of revenue: favorable when SG&A falls as a % of revenue, even if dollars rise."

# Derived lines get a direction verdict only. They are not accounts, so they never enter
# analyze_all and get no EXPLAIN/FLAG/IGNORE classification.
derived_lines:

  Gross profit:
    favorable_when: increase
    interpretation_hint: "Revenue less COGS; what remains of sales to cover operating costs"

  Operating income:
    favorable_when: increase
    interpretation_hint: "Gross profit less operating expenses; the core earnings result of the period"

  Gross margin:
    favorable_when: increase
    interpretation_hint: "Gross profit as a % of revenue; reflects pricing and direct-cost efficiency"

  Operating margin:
    favorable_when: increase
    interpretation_hint: "Operating income as a % of revenue; reflects overall cost efficiency of operations"
